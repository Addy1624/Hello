<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>An Important Question...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      overflow: hidden;
      padding: 16px;
      touch-action: none;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 380px;
      width: 100%;
      transition: all 0.3s ease;
    }
    .emoji {
      font-size: 70px;
      margin-bottom: 16px;
      display: block;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
    h1 {
      color: #2d3748;
      font-size: 1.6rem;
      margin-bottom: 24px;
      line-height: 1.3;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 60px;
    }
    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    #yesBtn {
      background-color: #48bb78;
      color: white;
      box-shadow: 0 4px 14px rgba(72, 187, 120, 0.4);
      z-index: 2;
    }
    #yesBtn:hover {
      background-color: #38a169;
    }
    #noBtn {
      background-color: #f56565;
      color: white;
      box-shadow: 0 4px 14px rgba(245, 101, 101, 0.4);
      transition: left 0.15s ease-out, top 0.15s ease-out;
      z-index: 9999;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <span class="emoji" id="emojiDisplay">🥺</span>
    <h1 id="questionText">Can we please talk and try to sort things out?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes!</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const questionText = document.getElementById('questionText');
    const emojiDisplay = document.getElementById('emojiDisplay');
    
    let yesScale = 1;
    let isReparented = false;

    function dodgeNoButton(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      // Move noBtn directly under <body> so position:fixed uses true phone screen coordinates
      if (!isReparented) {
        const rect = noBtn.getBoundingClientRect();
        document.body.appendChild(noBtn);
        noBtn.style.position = 'fixed';
        noBtn.style.left = `${rect.left}px`;
        noBtn.style.top = `${rect.top}px`;
        noBtn.style.margin = '0';
        isReparented = true;
      }

      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const padding = 16; // Safety margin from screen edge

      // Get exact screen boundaries
      const screenWidth = document.documentElement.clientWidth || window.innerWidth;
      const screenHeight = document.documentElement.clientHeight || window.innerHeight;

      // Calculate min/max strictly inside visible viewport
      const minX = padding;
      const maxX = Math.max(padding, screenWidth - btnWidth - padding);
      const minY = padding;
      const maxY = Math.max(padding, screenHeight - btnHeight - padding);

      // Generate clamped random positions
      let randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
      let randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

      // Force inside boundaries
      randomX = Math.max(minX, Math.min(randomX, maxX));
      randomY = Math.max(minY, Math.min(randomY, maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      // Grow Yes button
      yesScale += 0.08;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    noBtn.addEventListener('pointerdown', dodgeNoButton);
    noBtn.addEventListener('touchstart', dodgeNoButton, { passive: false });
    noBtn.addEventListener('mouseenter', dodgeNoButton);

    yesBtn.addEventListener('click', () => {
      noBtn.style.display = 'none';
      emojiDisplay.textContent = '🎉';
      questionText.textContent = 'Knew you would say yes! Send me a Hello on Instagram! 😁';
      yesBtn.style.transform = 'scale(1)';
      yesBtn.textContent = 'Woohoo!';
      yesBtn.style.backgroundColor = '#319795';
    });
  </script>
</body>
</html>
